name: 接口页面自动生成

on:
  workflow_dispatch:

concurrency:
  group: tvbox-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate pages
        run: python3 python/interface_validator.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-list.html multiline.txt multiline-urls.txt interface_check_summary.json
          git diff --cached --quiet || git commit -m "chore: update interface pages"
          git push origin HEAD:${GITHUB_REF_NAME}
