name: 整理生成接口

on:
  schedule:
    # 每天北京时间 04:00 运行
    # GitHub Actions 使用 UTC：北京时间 04:00 = UTC 20:00
    - cron: "0 20 * * *"

  workflow_dispatch:

concurrency:
  group: tvbox-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate pages
        run: python3 python/interface_validator.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-list.html multiline.txt multiline-urls.txt interface_check_summary.json tvbox-merged.json
          git diff --cached --quiet || git commit -m "Update daily merged TVBox interface"
          git push origin HEAD:main
